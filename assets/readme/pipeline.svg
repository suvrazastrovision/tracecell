   <g id="text_1">
    <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0f172a" x="28.8" y="41.39875" transform="rotate(-0 28.8 41.39875)">TraceCell</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #0f766e" x="979.2" y="35.71125" transform="rotate(-0 979.2 35.71125)">scRNA-seq knowledge platform</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475569" x="28.8" y="66.947188" transform="rotate(-0 28.8 66.947188)">Public human or mouse counts → explicit quality rules → results with evidence</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="176.4" y="128.59125" transform="rotate(-0 176.4 128.59125)">1  Choose a sample</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(72.089062 153.630312)">Upload .h5ad or use a public example</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(77.77125 170.680313)">Sparse, original counts; one sample</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="504" y="128.59125" transform="rotate(-0 504 128.59125)">2  Inspect the file</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(385.621094 154.134766)">Check dimensions, counts and annotations</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(416.309375 170.680313)">Identify available gene columns</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="831.6" y="129.75375" transform="rotate(-0 831.6 129.75375)">3  Review and submit</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(719.768672 153.630312)">Confirm species, mappings and QC rules</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(727.501328 170.680313)">Save a fixed configuration for this run</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b21b6" x="504" y="249.952344" transform="rotate(-0 504 249.952344)">PROCESSING  ·  progress and stage status are visible in the app</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="113.76" y="305.715094" transform="rotate(-0 113.76 305.715094)">QC metrics</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(58.361672 341.069187)">Counts, genes, mito %</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(54.539672 356.823453)">Pass / exclusion reasons</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="308.88" y="306.426375" transform="rotate(-0 308.88 306.426375)">Load tables</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(249.835 341.069187)">Cell and gene metadata</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(261.369906 356.259187)">Matrix stays in files</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="504" y="305.337938" transform="rotate(-0 504 305.337938)">dbt analytics</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(470.258906 341.456594)">6 SQL models</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(471.650813 357.208562)">30 data tests</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="699.12" y="305.337938" transform="rotate(-0 699.12 305.337938)">Verify independently</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(642.694969 341.069187)">Source, rows, analytics</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(642.001312 356.259187)">and exact passing cells</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="894.24" y="306.426375" transform="rotate(-0 894.24 306.426375)">Publish evidence</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(839.865312 342.018562)">Checksummed results</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(836.740031 356.259187)">Completion marker last</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="504" y="468.43125" transform="rotate(-0 504 468.43125)">4  Explore, download and compare</text>
   </g>
   <g id="text_22">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(248.610938 498.870313)">Four QC plots · PNG / JPEG / PDF · report and Run Evidence · same-sample policy comparison</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(257.636953 515.920313)">Paper QC rules need review and confirmation; an optional model answers cited questions</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f766e" x="504" y="576.420859" transform="rotate(-0 504 576.420859)">SAME SCIENTIFIC CHECKS, TWO RUNTIMES</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="259.2" y="628.527344" transform="rotate(-0 259.2 628.527344)">Local  ·  no GCP account needed</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(126.202734 658.382344)">Python serves the browser UI and FastAPI backend</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(126.635039 674.657344)">SQLite: run history  ·  local files: inputs and results</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(131.83582 691.347422)">DuckDB + dbt: metadata tables and SQL checks</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="748.8" y="627.368359" transform="rotate(-0 748.8 627.368359)">GCP deployment  ·  project owner pays</text>
   </g>
   <g id="text_27">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(643.261875 658.382344)">Cloud Run Jobs + Workflows: processing</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(629.049141 674.657344)">Firestore: run state  ·  GCS: inputs and results</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(618.027422 690.932344)">BigQuery + dbt: metadata tables and SQL checks</text>
   </g>
   <g id="text_28">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #475569" x="504" y="748.235312" transform="rotate(-0 504 748.235312)">Cloud support: Terraform / IAM · Artifact Registry · Logging / Monitoring</text>
   </g>
   <g id="text_29">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="504" y="776.759375" transform="rotate(-0 504 776.759375)">Research QC pilot. No clinical interpretation or cell-type inference.</text>
   </g>
  </g>
 </g>
