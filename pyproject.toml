# Python 3.11. Run commands from the repository root with pip >=25.1.
# Shared groups keep each package constraint in one place.
[dependency-groups]
qc = [
    "scanpy>=1.11,<1.12",
    # Newer releases lack Intel macOS wheels; avoid compiling LLVM locally.
    "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite==0.45.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "anndata>=0.11,<0.13",
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "pyyaml",
    "python-dotenv",
    "google-cloud-storage>=3.0,<4.0",
]
warehouse = [
    {include-group = "qc"},
    "google-cloud-bigquery>=3.31,<4",
    "dbt-core>=1.12,<1.13",
    "dbt-bigquery>=1.12,<1.13",
]
knowledge = [
    {include-group = "warehouse"},
    "jsonschema>=4.26,<5",
]
app = [
    {include-group = "knowledge"},
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "firebase-admin>=6.6,<8",
    "google-cloud-firestore>=2.20,<3",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "matplotlib>=3.9,<4",
    "pypdf>=6,<8",
    "psutil>=6,<8",
    "openai>=2,<4",
]
dev = [
    "pytest",
    "dbt-duckdb>=1.11,<1.12",
]
